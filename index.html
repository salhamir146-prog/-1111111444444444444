<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست آنلاین تولید عکس فارسی (Hugging Face)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #resultArea {
            margin-top: 20px;
            display: none;
        }
        #generatedImage {
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .translation-info {
            font-size: 0.8rem;
            color: #38bdf8;
            margin-top: 5px;
            text-align: right;
        }
        .error {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ef4444;
            margin-top: 15px;
            text-align: right;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 ساخت عکس با متن فارسی</h1>
    
    <div class="form-group">
        <label for="apiKey">کلید API هاگینگ‌فیس (Access Token):</label>
        <input type="text" id="apiKey" placeholder="hf_...">
    </div>

    <div class="form-group">
        <label for="prompt">توصیف عکس به فارسی (یا انگلیسی):</label>
        <textarea id="prompt" rows="3">یک گربه فضانورد در حال ماهیگیری روی کره ماه، سبک دیجیتال آرت، باکیفیت</textarea>
        <div id="translatedText" class="translation-info"></div>
    </div>

    <button id="sendBtn" onclick="generateImage()">ساخت عکس 🎨</button>

    <div id="statusText" style="margin-top:15px; color:#94a3b8; font-size:0.9rem;"></div>

    <div id="resultArea">
        <p style="color:#4ade80; font-weight:bold;">✅ عکس با موفقیت ساخته شد:</p>
        <img id="generatedImage" src="" alt="عکس ساختگی">
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>
</div>

<script>
// تابع خودکار ترجمه فارسی به انگلیسی
async function translateToEnglish(text) {
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
    } catch (e) {
        return text; // اگر ترجمه خطا داد همون متن اصلی رو بفرست
    }
}

async function generateImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const rawPrompt = document.getElementById('prompt').value.trim();
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const resultArea = document.getElementById('resultArea');
    const generatedImage = document.getElementById('generatedImage');
    const errorBox = document.getElementById('errorBox');
    const translatedText = document.getElementById('translatedText');

    if (!apiKey) {
        alert('لطفاً ابتدا کلید API خود (hf_...) را وارد کنید!');
        return;
    }

    sendBtn.disabled = true;
    sendBtn.innerText = 'در حال پردازش و ترجمه... ⏳';
    statusText.innerText = 'در حال ترجمه متن به انگلیسی...';
    resultArea.style.display = 'none';
    errorBox.style.display = 'none';

    // ۱. ترجمه خودکار متن فارسی به انگلیسی
    const englishPrompt = await translateToEnglish(rawPrompt);
    translatedText.innerText = `🔍 ترجمه ارسال‌شده به هوش مصنوعی: "${englishPrompt}"`;

    statusText.innerText = 'در حال ساخت عکس روی سرورهای Hugging Face...';

    // ۲. ارسال به مدل FLUX.1
    const modelUrl = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev";

    try {
        const response = await fetch(modelUrl, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ inputs: englishPrompt })
        });

        if (response.ok) {
            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            generatedImage.src = imageUrl;
            resultArea.style.display = 'block';
            statusText.innerText = '';
        } else {
            const errData = await response.json();
            errorBox.style.display = 'block';
            errorBox.innerText = `خطا: ${errData.error || 'ساخت عکس با مشکل مواجه شد.'}`;
            statusText.innerText = '';
        }
    } catch (err) {
        errorBox.style.display = 'block';
        errorBox.innerText = 'خطای شبکه! از اتصال اینترنت و فعال بودن ابزار تغییر IP مطمئن شوید.';
        statusText.innerText = '';
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'ساخت عکس 🎨';
    }
}
</script>

</body>
</html>
