<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست آنلاین ساخت عکس با متن فارسی</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #resultArea {
            margin-top: 20px;
            display: none;
        }
        #generatedImage {
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .translation-info {
            font-size: 0.8rem;
            color: #38bdf8;
            margin-top: 5px;
            text-align: right;
        }
        .loading {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 ساخت عکس با متن فارسی</h1>
    
    <div class="form-group">
        <label for="prompt">توصیف عکس به فارسی:</label>
        <textarea id="prompt" rows="3">یک گربه فضانورد در حال ماهیگیری روی کره ماه</textarea>
        <div id="translatedText" class="translation-info"></div>
    </div>

    <button id="sendBtn" onclick="generateImage()">ساخت عکس 🎨</button>

    <div id="loadingText" class="loading">در حال ترجمه و پردازش تصویر... ⏳</div>

    <div id="resultArea">
        <p style="color:#4ade80; font-weight:bold; margin-bottom: 5px;">✅ عکس شما آماده شد:</p>
        <img id="generatedImage" src="" alt="عکس ساخته شده">
    </div>
</div>

<script>
// تابع ترجمه خودکار فارسی به انگلیسی
async function translateToEnglish(text) {
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
    } catch (e) {
        return text;
    }
}

async function generateImage() {
    const rawPrompt = document.getElementById('prompt').value.trim();
    const sendBtn = document.getElementById('sendBtn');
    const loadingText = document.getElementById('loadingText');
    const resultArea = document.getElementById('resultArea');
    const generatedImage = document.getElementById('generatedImage');
    const translatedText = document.getElementById('translatedText');

    if (!rawPrompt) {
        alert('لطفاً متنی برای ساخت عکس وارد کنید!');
        return;
    }

    sendBtn.disabled = true;
    sendBtn.innerText = 'در حال ساخت... ⏳';
    loadingText.style.display = 'block';
    resultArea.style.display = 'none';
    translatedText.innerText = '';

    // ۱. ترجمه متن فارسی به انگلیسی
    const englishPrompt = await translateToEnglish(rawPrompt);
    translatedText.innerText = `🔍 ترجمه شده به انگلیسی: "${englishPrompt}"`;

    // ۲. ساخت لینک تصویر و بارگذاری مستقیم (بدون خطای شبکه و بدون نیاز به کلید)
    const encodedPrompt = encodeURIComponent(englishPrompt);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true`;

    // ۳. بررسی لود شدن عکس
    const imgTest = new Image();
    imgTest.src = imageUrl;
    
    imgTest.onload = function() {
        generatedImage.src = imageUrl;
        resultArea.style.display = 'block';
        loadingText.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.innerText = 'ساخت عکس 🎨';
    };

    imgTest.onerror = function() {
        loadingText.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.innerText = 'ساخت عکس 🎨';
        alert('خطا در دریافت تصویر. لطفاً اتصال اینترنت خود را بررسی کنید.');
    };
}
</script>

</body>
</html>
